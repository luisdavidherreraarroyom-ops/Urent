<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urent - Crear cuenta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6; padding: 2rem 0; }
        .login-card { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #2c3e50; margin-bottom: 0.5rem; font-weight: 600; }
        .login-card .subtitulo { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #007bff; }
        .form-group .ayuda { font-size: 0.78rem; color: #999; margin-top: 0.3rem; }
        .btn-submit { width: 100%; padding: 0.75rem; background-color: #007bff; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { background-color: #0056b3; }
        .mensaje { padding: 0.75rem; border-radius: 6px; margin-bottom: 1.2rem; font-size: 0.9rem; display: none; }
        .mensaje-error { background-color: #fdecea; color: #b71c1c; }
        .link-login { text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: #555; }
        .link-login a { color: #007bff; text-decoration: none; font-weight: 600; }
        .link-login a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Urent</h2>
        <p class="subtitulo">Crea tu cuenta para comenzar</p>

        <div id="mensaje-error" class="mensaje mensaje-error"></div>

        <form action="registro" method="post">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Luis Arias">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="300 123 4567">
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required minlength="6" placeholder="••••••••">
                <div class="ayuda">Mínimo 6 caracteres</div>
            </div>

            <div class="form-group">
                <label for="confirmarContrasena">Confirmar contraseña</label>
                <input type="password" id="confirmarContrasena" name="confirmarContrasena" required minlength="6" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

        <p class="link-login">¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');

        if (error) {
            const mensajes = {
                'campos_vacios': 'Por favor completa todos los campos.',
                'contrasenas_no_coinciden': 'Las contraseñas no coinciden.',
                'correo_existente': 'Ese correo ya está registrado. Intenta iniciar sesión.',
                'error_servidor': 'Ocurrió un error al registrar. Intenta de nuevo.'
            };

            const mensajeDiv = document.getElementById('mensaje-error');
            mensajeDiv.textContent = mensajes[error] || 'Ocurrió un error inesperado.';
            mensajeDiv.style.display = 'block';
        }
    </script>
</body>
</html>
