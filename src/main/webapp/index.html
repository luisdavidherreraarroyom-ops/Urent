
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urent - Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background: #f4f7f6;
            color: #333;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.10);
        }

        .logo {
            display: block;
            width: 100px;
            height: auto;
            margin: 0 auto 1rem;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: .5rem;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: .9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: .5rem;
            font-size: .9rem;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: .8rem;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,.12);
        }

        button {
            width: 100%;
            padding: .85rem;
            border: none;
            border-radius: 7px;
            background: #007bff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .mensaje {
            display: none;
            padding: .8rem;
            border-radius: 7px;
            margin-bottom: 1.2rem;
            font-size: .9rem;
        }

        .mensaje-exito {
            display: none;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .mensaje-error {
            display: none;
            background: #fdecea;
            color: #b71c1c;
        }

        .registro {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .9rem;
            color: #555;
        }

        .registro a {
            color: #007bff;
            font-weight: 600;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img src="images/logo-urent.png" alt="Urent" class="logo">

        <h1>Bienvenido a Urent</h1>

        <p class="subtitulo">
            Inicia sesión para continuar
        </p>

        <div id="mensaje-exito" class="mensaje mensaje-exito" role="status">
            ¡Registro exitoso! Ya puedes iniciar sesión.
        </div>

        <div id="mensaje-error" class="mensaje mensaje-error" role="alert"></div>

        <form action="login" method="POST" id="formLogin">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Tu contraseña">
            </div>

            <button type="submit">Iniciar sesión</button>

        </form>

        <p class="registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Regístrate aquí</a>
        </p>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        const mensajeExito = document.getElementById('mensaje-exito');
        const mensajeError = document.getElementById('mensaje-error');

        if (params.get('registro') === 'exitoso') {
            mensajeExito.style.display = 'block';
        }

        const errores = {
            invalid_credentials: 'Correo o contraseña incorrectos.',
            campos_vacios: 'Por favor completa todos los campos.',
            error_servidor: 'Ocurrió un error. Intenta nuevamente.'
        };

        const error = params.get('error');

        if (error) {
            mensajeError.textContent =
                errores[error] || 'Ocurrió un error inesperado.';

            mensajeError.style.display = 'block';
        }
    </script>

</body>
</html>
