
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urent - Iniciar Sesión</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #f4f7f6;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .mensaje {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: none;
        }

        .mensaje-error {
            background-color: #fdecea;
            color: #b71c1c;
        }

        .mensaje-exito {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .mensaje-info {
            background-color: #e7f1fb;
            color: #0b4a8f;
        }

        .link-login {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #555;
        }

        .link-login a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }

        .link-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h2>Urent</h2>

        <div id="mensaje" class="mensaje" role="alert"></div>

        <form action="login" method="POST">

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="ejemplo@correo.com"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="••••••••"
                >
            </div>

            <button type="submit" class="btn-submit">
                Iniciar Sesión
            </button>

        </form>

        <p class="link-login">
            ¿No tienes cuenta?
            <a href="registro.html">Regístrate aquí</a>
        </p>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const error = params.get('error');
        const registro = params.get('registro');

        const mensajeDiv = document.getElementById('mensaje');

        if (error === 'invalid_credentials') {

            mensajeDiv.textContent = 'Correo o contraseña incorrectos.';
            mensajeDiv.classList.add('mensaje-error');
            mensajeDiv.style.display = 'block';

        } else if (error === 'sesion_expirada') {

            mensajeDiv.textContent = 'Tu sesión terminó. Inicia sesión de nuevo.';
            mensajeDiv.classList.add('mensaje-info');
            mensajeDiv.style.display = 'block';

        } else if (error === 'sin_permiso') {

            mensajeDiv.textContent = 'No tienes permiso para entrar a esa página.';
            mensajeDiv.classList.add('mensaje-error');
            mensajeDiv.style.display = 'block';

        } else if (registro === 'exitoso') {

            mensajeDiv.textContent = '¡Cuenta creada correctamente! Ya puedes iniciar sesión.';
            mensajeDiv.classList.add('mensaje-exito');
            mensajeDiv.style.display = 'block';

        }
    </script>

</body>
</html>
