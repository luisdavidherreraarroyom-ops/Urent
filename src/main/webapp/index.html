
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urent - Iniciar Sesión</title>

    <style>

        /* CONFIGURACIÓN GENERAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            padding: 20px;
        }

        /* TARJETA DE LOGIN */
        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* LOGO DE URENT */
        .logo-urent {
            display: block;
            width: 150px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 15px;
            object-fit: contain;
        }

        /* OCULTAR TÍTULO HTML DUPLICADO */
        .login-card h2 {
            display: none !important;
        }

        /* CAMPOS DEL FORMULARIO */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        /* BOTÓN DE INICIO DE SESIÓN */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        /* MENSAJES DEL SISTEMA */
        .mensaje {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: none;
        }

        .mensaje-error {
            background-color: #fdecea;
            color: #b71c1c;
        }

        .mensaje-exito {
            background-color: #e8f5e9;
            color: #1b5e20;
        }

        /* ENLACE DE REGISTRO */
        .link-login {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 25px;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #555;
        }

        .link-login a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }

        .link-login a:hover {
            text-decoration: underline;
        }

        /* DISEÑO RESPONSIVE */
        @media (max-width: 480px) {

            .login-card {
                padding: 2rem 1.5rem;
            }

            .logo-urent {
                width: 120px;
            }

        }

    </style>

</head>

<body>

    <!-- TARJETA PRINCIPAL -->
    <div class="login-card">

        <!-- LOGO ORIGINAL DE URENT -->
        <img
            src="/Urent/images/logo-urent.png"
            alt="Logo de Urent"
            class="logo-urent"
        >

        <!-- TÍTULO HTML OCULTO POR CSS -->

        <!-- MENSAJES DEL SISTEMA -->
        <div id="mensaje" class="mensaje"></div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form action="login" method="POST">

            <div class="form-group">

                <label for="email">Correo Electrónico</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="ejemplo@correo.com"
                >

            </div>

            <div class="form-group">

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="••••••••"
                >

            </div>

            <button type="submit" class="btn-submit">
                Iniciar Sesión
            </button>

        </form>

        <!-- ENLACE DE REGISTRO -->
        <div class="link-login">

            <span>¿No tienes cuenta?</span>

            <a href="registro.html">Regístrate aquí</a>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        // Obtener parámetros de la URL
        const params = new URLSearchParams(window.location.search);

        const error = params.get('error');
        const registro = params.get('registro');

        const mensajeDiv = document.getElementById('mensaje');

        // Mostrar mensaje de error
        if (error === 'invalid_credentials') {

            mensajeDiv.textContent =
                'Correo o contraseña incorrectos.';

            mensajeDiv.classList.add('mensaje-error');

            mensajeDiv.style.display = 'block';

        }

        // Mostrar mensaje de registro exitoso
        else if (registro === 'exitoso') {

            mensajeDiv.textContent =
                '¡Cuenta creada correctamente! Ya puedes iniciar sesión.';

            mensajeDiv.classList.add('mensaje-exito');

            mensajeDiv.style.display = 'block';

        }

    </script>

</body>

</html>
